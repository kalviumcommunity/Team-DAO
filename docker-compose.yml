version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: stucart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-stucart_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stucart_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stucart-network

  # ----------------------------------------------------------------------------
  # 2. Next.js Web Application Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stucart-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_change_me}@postgres:5432/${POSTGRES_DB:-stucart_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-replace-with-secure-random-string}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
      SEED_DATABASE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - stucart-network

  # ----------------------------------------------------------------------------
  # 3. Real-Time WebSocket & Stock Alert Background Worker Service
  # ----------------------------------------------------------------------------
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stucart-websocket
    command: ["npx", "tsx", "src/backend/websocket/server.ts"]
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      WS_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_change_me}@postgres:5432/${POSTGRES_DB:-stucart_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-replace-with-secure-random-string}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stucart-network

volumes:
  postgres_data:
    driver: local

networks:
  stucart-network:
    driver: bridge
